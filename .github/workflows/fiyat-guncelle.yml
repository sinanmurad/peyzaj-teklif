name: Fiyatları güncelle

on:
  schedule:
    - cron: '17 3 1,11,21 * *'   # Her ayın 1, 11 ve 21'i, 06:17 (TR)
  workflow_dispatch:
    inputs:
      sadece:
        description: 'Sadece bir kaynak (enfidan / diger), boş = hepsi'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fiyatları çek
        run: python scripts/fiyat_guncelle.py
        env:
          SADECE: ${{ github.event.inputs.sadece }}
      - name: Değiştiyse kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add fiyatlar.json
          git diff --cached --quiet && echo "Değişiklik yok" || (git commit -m "Fiyatlar güncellendi $(date +%d.%m.%Y)" && git push)
